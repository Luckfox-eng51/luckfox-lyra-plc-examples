<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
<rect width="1280" height="900" fill="#f3f6fa"/>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#162b43}.title{font-size:30px;font-weight:bold}.sub{font-size:18px;fill:#48617b}.head{font-size:24px;font-weight:bold}.label{font-size:20px}.small{font-size:17px}.wire{fill:none;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.panel{fill:white;stroke:#c4d0dd;stroke-width:2}</style>
<text x="60" y="52" class="title">PLC + RS485 sensor: shared 12V DC supply</text>
<text x="60" y="83" class="sub">Sensor supply rating: DC 5–30V  |  Non-isolated sensor example  |  Disconnect power before wiring</text>
<rect x="60" y="115" width="1160" height="165" rx="16" class="panel"/>
<text x="640" y="157" text-anchor="middle" class="head">Regulated 12V DC power supply</text>
<text x="640" y="187" text-anchor="middle" class="sub">Shared supply: connect both devices to the same 12V and 0V rails</text>
<text x="220" y="228" text-anchor="middle" class="small">To PLC power input</text>
<text x="1020" y="228" text-anchor="middle" class="small">To sensor power input</text>
<text x="160" y="262" text-anchor="middle" class="label">DC+</text><text x="280" y="262" text-anchor="middle" class="label">DC−</text>
<text x="960" y="262" text-anchor="middle" class="label">DC+</text><text x="1080" y="262" text-anchor="middle" class="label">DC−</text>
<path d="M160 280V420 M960 280V420" class="wire" stroke="#d34848"/>
<path d="M280 280V420 M1080 280V420" class="wire" stroke="#485260"/>
<text x="350" y="330" class="sub">Power wires</text>
<text x="350" y="358" class="small">Supply negatives share a common reference.</text>
<text x="350" y="385" class="small">Use PLC SGND for the RS485 bus reference.</text>
<rect x="60" y="420" width="470" height="355" rx="16" class="panel"/>
<rect x="800" y="420" width="420" height="355" rx="16" class="panel"/>
<text x="160" y="452" text-anchor="middle" class="label">Power +</text><text x="280" y="452" text-anchor="middle" class="label">Power −</text>
<text x="960" y="452" text-anchor="middle" class="label">DC+</text><text x="1080" y="452" text-anchor="middle" class="label">DC−</text>
<text x="85" y="502" class="head">Luckfox Lyra PLC</text>
<text x="825" y="502" class="head">RS485 sensor</text>
<path d="M530 555H800" class="wire" stroke="#007f8b"/>
<path d="M530 625H800" class="wire" stroke="#4964d2"/>
<path d="M530 695H800" class="wire" stroke="#6b7280"/>
<text x="85" y="562" class="label">Pin 10 · TA / A+</text><text x="825" y="562" class="label">A / A+</text>
<text x="85" y="632" class="label">Pin 9 · TB / B−</text><text x="825" y="632" class="label">B / B−</text>
<text x="85" y="702" class="label">Pin 6 · SGND</text><text x="825" y="702" class="label">DC− / signal GND</text>
<text x="665" y="538" text-anchor="middle" class="small">RS485 A</text>
<text x="665" y="608" text-anchor="middle" class="small">RS485 B</text>
<text x="665" y="678" text-anchor="middle" class="small">Signal reference</text>
<text x="85" y="748" class="small">UART2: /dev/ttyS2 · TXEN: GPIO0_B7</text>
<text x="825" y="739" class="small">Both DC− labels refer to the same</text>
<text x="825" y="762" class="small">terminal on a four-wire sensor.</text>
<g fill="#d34848"><circle cx="160" cy="280" r="7"/><circle cx="960" cy="280" r="7"/><circle cx="160" cy="420" r="7"/><circle cx="960" cy="420" r="7"/></g>
<g fill="#485260"><circle cx="280" cy="280" r="7"/><circle cx="1080" cy="280" r="7"/><circle cx="280" cy="420" r="7"/><circle cx="1080" cy="420" r="7"/></g>
<g fill="#007f8b"><circle cx="530" cy="555" r="7"/><circle cx="800" cy="555" r="7"/></g>
<g fill="#4964d2"><circle cx="530" cy="625" r="7"/><circle cx="800" cy="625" r="7"/></g>
<g fill="#6b7280"><circle cx="530" cy="695" r="7"/><circle cx="800" cy="695" r="7"/></g>
<text x="60" y="818" class="small">Use a twisted pair for A/B. Pins 7/8 (RS422) are unused. PE is not SGND.</text>
<text x="60" y="848" class="small">For isolated sensors, follow the bus-side signal-ground definition in the sensor manual.</text>
<text x="60" y="878" class="sub">Electrical connections only; branch locations do not represent physical terminal positions.</text>
</svg>